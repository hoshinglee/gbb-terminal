[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gbb-terminal"
version = "0.4.3.dev0"
description = "Open-source US equity strategy research and options lifecycle simulator"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "GBB Terminal contributors"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "yfinance>=0.2.50,<1.0",
  "pandas>=2.2,<3.0",
  "numpy>=2.0,<3.0",
  "duckdb>=1.1,<2.0",
  "google-genai>=1.0,<2.0",
  "python-dotenv>=1.0,<2.0",
  "PyYAML>=6.0,<7.0",
  "pydantic>=2.10,<3.0",
  "optuna>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.9,<1.0",
]
llm-openai = ["openai>=1.0,<3.0"]
llm-anthropic = ["anthropic>=0.40,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

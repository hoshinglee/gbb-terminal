# Copy to conf/app.yaml to customize local runtime settings. Keep API keys in .env.
app:
  refresh_interval_seconds: 900
  data_contact: your-email@example.com

paths:
  frontend_directory: app
  database_path: data/gbb_terminal.duckdb
  log_directory: log

llm:
  # Supported values: google, openai, anthropic. Provider aliases: google_ai_studio, claude.
  provider: google
  timeout_ms: 45000
  temperature: 0.1
  max_output_tokens: 1200
  providers:
    google:
      model: gemini-3.6-flash
    openai:
      model: gpt-5
    anthropic:
      model: claude-sonnet-4-0
